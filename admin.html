<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>এডমিন প্যানেল — হামিদুল উলুম মাদ্রাসা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg1:#0f3d3e; --bg2:#1a5c4a; --bg3:#c9a24b;
  --glass:rgba(255,255,255,0.14); --glass-border:rgba(255,255,255,0.35);
  --text:#ffffff; --text-dim:rgba(255,255,255,0.75);
  --accent:#e8c368; --card-shadow:rgba(0,0,0,0.25);
  --danger:#e08a8a; --good:#8fd6b0;
}
:root[data-theme="light"]{
  --bg1:#e9f2ee; --bg2:#cfe6dc; --bg3:#f0dba7;
  --glass:rgba(255,255,255,0.55); --glass-border:rgba(255,255,255,0.8);
  --text:#0f3d3e; --text-dim:rgba(15,61,62,0.7);
  --accent:#9c7a25; --card-shadow:rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Hind Siliguri',sans-serif;min-height:100vh;
  background:
    radial-gradient(circle at 15% -10%, rgba(232,195,104,0.35), transparent 45%),
    radial-gradient(circle at 100% 15%, rgba(143,214,196,0.3), transparent 50%),
    radial-gradient(circle at 20% 100%, rgba(45,120,100,0.4), transparent 55%),
    linear-gradient(160deg, var(--bg2), var(--bg1) 65%);
  color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background .3s;
}
.glass{background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px;box-shadow:0 8px 32px var(--card-shadow);}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 14px;}
.badge{font-size:.7rem;padding:5px 12px;border-radius:20px;background:var(--accent);color:#1a2e20;font-weight:600;}
.title{font-size:1.3rem;font-weight:700;
  background:linear-gradient(90deg,var(--accent),#8fd6c4,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.theme-toggle{display:flex;gap:6px;}
.tt-btn{padding:7px 10px;border-radius:12px;font-size:.75rem;cursor:pointer;color:var(--text-dim);}
.tt-btn.active{background:var(--accent);color:#1a2e20;font-weight:600;}

.tabs-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;}
.tab-chip{flex:0 0 auto;padding:9px 14px;font-size:.82rem;cursor:pointer;color:var(--text-dim);white-space:nowrap;
  background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:14px;box-shadow:0 4px 16px var(--card-shadow);}
.tab-chip.active{background:linear-gradient(90deg,var(--accent),#d9b968);color:#1a2e20;font-weight:600;border-color:transparent;}

.panel{padding:18px;margin-bottom:14px;}
.panel h3{font-size:1rem;margin-bottom:12px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat{padding:14px;text-align:center;}
.stat b{font-size:1.4rem;display:block;color:var(--accent);}
.stat span{font-size:.72rem;color:var(--text-dim);}

.row{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;margin-bottom:8px;font-size:.85rem;
  background:rgba(255,255,255,0.08);border:1px solid var(--glass-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px;}
:root[data-theme="light"] .row{background:rgba(255,255,255,0.35);}
.row:last-child{margin-bottom:0;}
.pill{font-size:.7rem;padding:5px 12px;border-radius:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);}
.pill.pending{background:rgba(224,138,138,0.22);color:var(--danger);}
.pill.paid{background:rgba(143,214,176,0.22);color:var(--good);}
.mini-btn{font-size:.72rem;padding:6px 10px;border-radius:10px;cursor:pointer;color:var(--text);
  background:rgba(255,255,255,0.15);border:1px solid var(--glass-border);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}

.field{margin-bottom:12px;}
.field label{font-size:.75rem;color:var(--text-dim);display:block;margin-bottom:5px;}
.field input,.field select{width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.1);color:var(--text);font-family:inherit;font-size:.85rem;outline:none;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
:root[data-theme="light"] .field input,:root[data-theme="light"] .field select{background:rgba(255,255,255,0.45);}
.field select option{color:#1a2e20;}
.btn-primary{width:100%;padding:12px;border:none;border-radius:14px;font-family:inherit;font-weight:600;font-size:.88rem;background:linear-gradient(90deg,var(--accent),#d9b968);color:#1a2e20;cursor:pointer;margin-top:4px;}

.custom-item{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
.custom-item input{flex:1;}
.icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  background:rgba(255,255,255,0.15);border:1px solid var(--glass-border);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.note{font-size:.72rem;color:var(--text-dim);margin-top:8px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="title">এডমিন প্যানেল</div>
      <span class="badge">হামিদুল উলুম মাদ্রাসা</span>
    </div>
    <div class="theme-toggle">
      <div class="tt-btn active" id="lightBtn" onclick="setTheme('light',this)">☀️</div>
      <div class="tt-btn" id="darkBtn" onclick="setTheme('dark',this)">🌙</div>
      <div class="tt-btn" onclick="doLogout()" style="color:var(--danger);">🚪</div>
    </div>
  </div>

  <div class="tabs-row" id="tabsRow"></div>
  <div id="panels"></div>
</div>

<script>
function setTheme(mode,el){
  document.documentElement.setAttribute('data-theme',mode);
  document.querySelectorAll('.theme-toggle .tt-btn').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}

// --- Supabase কানেকশন ও এডমিন-অ্যাক্সেস যাচাই ---
const sb = window.supabase.createClient(
  'https://fraqjybeoozsqqbbmqem.supabase.co',
  'sb_publishable_GjIDgcF6NT3p83PLRTLGww_5DDGRiO_'
);

async function doLogout(){
  await sb.auth.signOut();
  location.href = 'index.html';
}

let allProfiles = [];

async function checkAdminAndLoad(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ alert('আগে লগইন করুন'); location.href = 'index.html'; return; }
  const {data:profile, error:pErr} = await sb.from('profiles').select('role').eq('id', session.user.id).single();
  if(pErr || !profile || profile.role !== 'admin'){
    alert('এই পেজ শুধু এডমিনদের জন্য');
    location.href = 'index.html';
    return;
  }
  const {data:profiles, error} = await sb.from('profiles').select('*').order('created_at', {ascending:false});
  if(!error && profiles){ allProfiles = profiles; }
  const {data:pendingAdm} = await sb.from('admissions').select('id',{count:'exact',head:false}).eq('status','pending');
  renderOverview(pendingAdm ? pendingAdm.length : 0);
  renderUsersTabs();
}
checkAdminAndLoad();

function renderOverview(pendingCount){
  const el = document.getElementById('studentCount');
  if(el) el.textContent = allProfiles.filter(p=>p.role==='student').length;
  const pEl = document.getElementById('pendingAdmCount');
  if(pEl && typeof pendingCount==='number') pEl.textContent = pendingCount;
}

function renderUsersTabs(){
  const rows = allProfiles.map(p=>
    `<div class="row"><span>${p.full_name || '(নাম নেই)'} — ${p.phone || p.email || ''}</span>
      <span class="pill ${p.role==='admin' ? 'paid':'pending'}">${p.role==='admin'?'এডমিন':'ছাত্র'}</span></div>`
  ).join('') || '<div class="note">এখনো কোনো ইউজার সাইনআপ করেনি।</div>';
  panels.students = `
    <div class="panel glass">
      <h3>ছাত্র/ইউজার তালিকা (মোট ${allProfiles.length} জন)</h3>
      ${rows}
    </div>`;
  panels.users = `
    <div class="panel glass">
      <h3>ইউজার ব্যবস্থাপনা</h3>
      ${rows}
      <div class="note">পাসওয়ার্ড রিসেট এখনো এখান থেকে করা যায় না — Supabase Dashboard → Authentication → Users থেকে ম্যানুয়ালি করা যাবে।</div>
    </div>`;
  const activeTab = document.querySelector('.tab-chip.active');
  if(activeTab && (activeTab.dataset.tab==='students' || activeTab.dataset.tab==='users')){
    document.getElementById('panels').innerHTML = panels[activeTab.dataset.tab];
  }
}

const tabs = [
  {id:'overview', label:'ওভারভিউ'},
  {id:'admissions', label:'ভর্তি আবেদন'},
  {id:'fees', label:'বেতন'},
  {id:'complaints', label:'অভিযোগ কেন্দ্র'},
  {id:'students', label:'ছাত্র তালিকা'},
  {id:'notice', label:'নোটিশ'},
  {id:'users', label:'ইউজার/পাসওয়ার্ড'},
  {id:'customize', label:'ড্যাশবোর্ড কাস্টমাইজ'},
];

document.getElementById('tabsRow').innerHTML = tabs.map((t,i)=>
  `<div class="tab-chip ${i===0?'active':''}" data-tab="${t.id}" onclick="showTab('${t.id}',this)">${t.label}</div>`
).join('');

const panels = {
overview:`
  <div class="panel glass">
    <div class="stat-grid">
      <div class="stat glass"><b id="studentCount">0</b><span>মোট ছাত্র</span></div>
      <div class="stat glass"><b id="pendingAdmCount">0</b><span>নতুন আবেদন (অপেক্ষমান)</span></div>
      <div class="stat glass"><b>৮৯%</b><span>এ মাসের বেতন আদায়</span></div>
      <div class="stat glass"><b>৬</b><span>বিভাগ</span></div>
    </div>
    <h3>সাম্প্রতিক কার্যক্রম</h3>
    <div class="row"><span>নতুন ভর্তি আবেদন — রাকিব হাসান</span><span class="pill pending">অপেক্ষমান</span></div>
    <div class="row"><span>বেতন পরিশোধ — জান্নাতুল ফেরদৌস (হিফজ)</span><span class="pill paid">পরিশোধিত</span></div>
    <div class="row"><span>নোটিশ প্রকাশ — বার্ষিক পরীক্ষার রুটিন</span><span class="pill paid">প্রকাশিত</span></div>
  </div>`,

admissions:`
  <div class="panel glass">
    <h3>ভর্তি আবেদনসমূহ</h3>
    <div id="admissionsList">লোড হচ্ছে...</div>
    <div class="note">প্রতিটি আবেদনে ছাত্রের জন্ম নিবন্ধন ও পাসপোর্ট সাইজ ছবি সংযুক্ত থাকবে — এডমিন চাইলে অনুমোদন বা বাতিল করতে পারবেন।</div>
  </div>`,

fees:`
  <div class="panel glass">
    <h3>নতুন বেতন এন্ট্রি যোগ করুন</h3>
    <div class="field"><label>ছাত্র বাছাই করুন</label><select id="feeStudentSelect"></select></div>
    <div class="two-col">
      <div class="field"><label>মাস</label><input id="feeMonth" placeholder="যেমনঃ সেপ্টেম্বর ২০২৬"></div>
      <div class="field"><label>পরিমাণ (টাকা)</label><input id="feeAmount" type="number" placeholder="৫০০"></div>
    </div>
    <button class="btn-primary" onclick="addFee()">এন্ট্রি যোগ করুন</button>
  </div>
  <div class="panel glass">
    <h3>বেতন ব্যবস্থাপনা</h3>
    <div id="feesList">লোড হচ্ছে...</div>
    <div class="note">এডমিন এখান থেকে ম্যানুয়ালি "পরিশোধিত" হিসেবে চিহ্নিত করতে পারবেন।</div>
  </div>`,

complaints:`
  <div class="panel glass">
    <h3>অভিযোগসমূহ</h3>
    <div id="complaintsList">লোড হচ্ছে...</div>
    <div class="note">এডমিন প্রতিটি অভিযোগ "সমাধান হয়েছে" হিসেবে চিহ্নিত করতে পারবেন।</div>
  </div>`,

notice:`
  <div class="panel glass">
    <h3>নতুন নোটিশ যোগ করুন</h3>
    <div class="field"><label>শিরোনাম</label><input id="noticeTitle" placeholder="যেমনঃ বার্ষিক পরীক্ষার রুটিন"></div>
    <div class="field"><label>বিস্তারিত</label><input id="noticeBody" placeholder="নোটিশের বিবরণ লিখুন"></div>
    <button class="btn-primary" onclick="publishNotice()">নোটিশ প্রকাশ করুন</button>
  </div>
  <div class="panel glass">
    <h3>প্রকাশিত নোটিশসমূহ</h3>
    <div id="noticesList">লোড হচ্ছে...</div>
  </div>`,

users:`
  <div class="panel glass">
    <h3>ইউজার ব্যবস্থাপনা</h3>
    <div class="note">পাসওয়ার্ড রিসেট এখনো এখান থেকে করা যায় না — Supabase Dashboard → Authentication → Users থেকে ম্যানুয়ালি করা যাবে।</div>
  </div>`,

customize:`

    <div class="note">এখানে যা পরিবর্তন করবেন "সংরক্ষণ করুন" চাপার পর তা ছাত্রদের ড্যাশবোর্ডে দেখা যাবে।</div>

// ===== ভর্তি আবেদন =====
async function loadAdmissions(){
  const {data, error} = await sb.from('admissions').select('*').order('created_at',{ascending:false});
  const el = document.getElementById('admissionsList');
  if(!el) return;
  if(error){ el.innerHTML = 'লোড করতে সমস্যা হয়েছে: '+error.message; return; }
  if(!data || data.length===0){ el.innerHTML = '<div class="note">এখনো কোনো ভর্তি আবেদন জমা হয়নি।</div>'; return; }
  el.innerHTML = data.map(a=>{
    const statusLabel = a.status==='approved'?'অনুমোদিত':(a.status==='rejected'?'বাতিল':'অপেক্ষমান');
    const pillClass = a.status==='approved'?'paid':(a.status==='rejected'?'pending':'pending');
    const actions = a.status==='pending' ? `
      <div style="display:flex;gap:6px;margin-top:6px;">
        <span class="mini-btn" onclick="setAdmissionStatus('${a.id}','approved')">✅ অনুমোদন</span>
        <span class="mini-btn" onclick="setAdmissionStatus('${a.id}','rejected')">❌ বাতিল</span>
      </div>` : '';
    return `<div class="row" style="flex-direction:column;align-items:stretch;">
      <div style="display:flex;justify-content:space-between;">
        <span>${a.full_name} — ${a.department||''}</span>
        <span class="pill ${pillClass}">${statusLabel}</span>
      </div>
      ${actions}
    </div>`;
  }).join('');
}
async function setAdmissionStatus(id, status){
  const {error} = await sb.from('admissions').update({status}).eq('id', id);
  if(error){ alert('আপডেট ব্যর্থ: '+error.message); return; }
  loadAdmissions();
}

// ===== বেতন =====
async function loadFees(){
  const sel = document.getElementById('feeStudentSelect');
  if(sel){ sel.innerHTML = allProfiles.filter(p=>p.role==='student').map(p=>`<option value="${p.id}">${p.full_name||p.phone||p.email}</option>`).join(''); }
  const {data, error} = await sb.from('fees').select('*, profiles(full_name)').order('paid_at',{ascending:false});
  const el = document.getElementById('feesList');
  if(!el) return;
  if(error){ el.innerHTML = 'লোড করতে সমস্যা হয়েছে: '+error.message; return; }
  if(!data || data.length===0){ el.innerHTML = '<div class="note">এখনো কোনো বেতন এন্ট্রি নেই।</div>'; return; }
  el.innerHTML = data.map(f=>{
    const name = f.profiles ? f.profiles.full_name : 'অজানা';
    const action = f.status==='due' ? `<span class="mini-btn" onclick="markFeePaid('${f.id}')">পরিশোধিত করুন</span>` : '';
    return `<div class="row"><span>${name} — ${f.month} (৳${f.amount})</span>
      <span class="pill ${f.status==='paid'?'paid':'pending'}">${f.status==='paid'?'পরিশোধিত':'বাকি'}</span></div>
      ${action ? `<div style="margin:-4px 0 8px;">${action}</div>` : ''}`;
  }).join('');
}
async function addFee(){
  const student_id = document.getElementById('feeStudentSelect').value;
  const month = document.getElementById('feeMonth').value.trim();
  const amount = document.getElementById('feeAmount').value;
  if(!student_id || !month || !amount){ alert('সব ফিল্ড পূরণ করুন'); return; }
  const {error} = await sb.from('fees').insert({student_id, month, amount, status:'due'});
  if(error){ alert('যোগ করতে সমস্যা: '+error.message); return; }
  document.getElementById('feeMonth').value=''; document.getElementById('feeAmount').value='';
  loadFees();
}
async function markFeePaid(id){
  const {error} = await sb.from('fees').update({status:'paid', paid_at: new Date().toISOString()}).eq('id', id);
  if(error){ alert('আপডেট ব্যর্থ: '+error.message); return; }
  loadFees();
}

// ===== অভিযোগ =====
async function loadComplaints(){
  const {data, error} = await sb.from('complaints').select('*, profiles(full_name)').order('created_at',{ascending:false});
  const el = document.getElementById('complaintsList');
  if(!el) return;
  if(error){ el.innerHTML = 'লোড করতে সমস্যা হয়েছে: '+error.message; return; }
  if(!data || data.length===0){ el.innerHTML = '<div class="note">এখনো কোনো অভিযোগ জমা হয়নি।</div>'; return; }
  el.innerHTML = data.map(c=>{
    const name = c.profiles ? c.profiles.full_name : 'অজানা';
    const action = c.status==='pending' ? `<span class="mini-btn" onclick="resolveComplaint('${c.id}')">সমাধান হয়েছে চিহ্নিত করুন</span>` : '';
    return `<div class="row" style="flex-direction:column;align-items:stretch;">
      <div style="display:flex;justify-content:space-between;">
        <span>${c.subject||''} — ${name}</span>
        <span class="pill ${c.status==='resolved'?'paid':'pending'}">${c.status==='resolved'?'সমাধান হয়েছে':'পর্যালোচনাধীন'}</span>
      </div>
      ${c.details?`<div class="note" style="margin-top:4px;">${c.details}</div>`:''}
      ${action?`<div style="margin-top:6px;">${action}</div>`:''}
    </div>`;
  }).join('');
}
async function resolveComplaint(id){
  const {error} = await sb.from('complaints').update({status:'resolved'}).eq('id', id);
  if(error){ alert('আপডেট ব্যর্থ: '+error.message); return; }
  loadComplaints();
}

// ===== নোটিশ =====
async function loadNotices(){
  const {data, error} = await sb.from('notices').select('*').order('created_at',{ascending:false});
  const el = document.getElementById('noticesList');
  if(!el) return;
  if(error){ el.innerHTML = 'লোড করতে সমস্যা হয়েছে: '+error.message; return; }
  if(!data || data.length===0){ el.innerHTML = '<div class="note">এখনো কোনো নোটিশ প্রকাশ হয়নি।</div>'; return; }
  el.innerHTML = data.map(n=>
    `<div class="row"><span>${n.title}</span><span class="mini-btn" onclick="deleteNotice('${n.id}')">🗑️ মুছুন</span></div>`
  ).join('');
}
async function publishNotice(){
  const title = document.getElementById('noticeTitle').value.trim();
  const body = document.getElementById('noticeBody').value.trim();
  if(!title){ alert('শিরোনাম দিন'); return; }
  const {error} = await sb.from('notices').insert({title, body});
  if(error){ alert('প্রকাশ করতে সমস্যা: '+error.message); return; }
  document.getElementById('noticeTitle').value=''; document.getElementById('noticeBody').value='';
  loadNotices();
}
async function deleteNotice(id){
  const {error} = await sb.from('notices').delete().eq('id', id);
  if(error){ alert('মুছতে সমস্যা: '+error.message); return; }
  loadNotices();
}

// ===== ড্যাশবোর্ড কাস্টমাইজ =====
async function loadCustomize(){
  const {data, error} = await sb.from('dashboard_items').select('*').order('sort_order',{ascending:true});
  if(!error && data){ customLabels = data; }
  initCustomize();
}
async function saveCustomize(){
  await sb.from('dashboard_items').delete().not('id','is',null);
  const rows = customLabels.map((c,i)=>({label: c.label, sort_order:i}));
  const {error} = await sb.from('dashboard_items').insert(rows);
  if(error){ alert('সংরক্ষণ ব্যর্থ: '+error.message); return; }
  alert('সংরক্ষিত হয়েছে — ছাত্রদের হোমপেজে এখন এটা দেখা যাবে।');
  loadCustomize();
}

function showTab(id,el){
  document.querySelectorAll('.tab-chip').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panels').innerHTML = panels[id] || '<div class="panel glass">লোড হচ্ছে...</div>';
  if(id==='customize') loadCustomize();
  if(id==='admissions') loadAdmissions();
  if(id==='fees') loadFees();
  if(id==='complaints') loadComplaints();
  if(id==='notice') loadNotices();
}
showTab('overview', document.querySelector('.tab-chip'));

let customLabels = [];
function initCustomize(){
  const list = document.getElementById('customList');
  if(!list) return;
  list.innerHTML = customLabels.map((v,i)=>
    `<div class="custom-item">
      <input value="${v.label}" onchange="customLabels[${i}].label=this.value">
      <div class="icon-btn" onclick="removeItem(${i})">🗑️</div>
     </div>`
  ).join('');
}
function addCustomItem(){ customLabels.push({label:'নতুন অপশন'}); initCustomize(); }
function removeItem(i){ customLabels.splice(i,1); initCustomize(); }
</script>
</body>
