<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অভিযোগ কেন্দ্র — হামিদুল উলুম মাদ্রাসা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0f3d3e; --bg2:#1a5c4a; --bg3:#c9a24b;
  --glass:rgba(255,255,255,0.14); --glass-border:rgba(255,255,255,0.35);
  --text:#ffffff; --text-dim:rgba(255,255,255,0.75);
  --accent:#e8c368; --card-shadow:rgba(0,0,0,0.25);
  --danger:#e08a8a; --good:#8fd6b0;
}
:root[data-theme="light"]{
  --bg1:#e9f2ee; --bg2:#cfe6dc; --bg3:#f0dba7;
  --glass:rgba(255,255,255,0.55); --glass-border:rgba(255,255,255,0.8);
  --text:#0f3d3e; --text-dim:rgba(15,61,62,0.7);
  --accent:#9c7a25; --card-shadow:rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Hind Siliguri',sans-serif;min-height:100vh;
  background:
    radial-gradient(circle at 15% -10%, rgba(232,195,104,0.35), transparent 45%),
    radial-gradient(circle at 100% 15%, rgba(143,214,196,0.3), transparent 50%),
    radial-gradient(circle at 20% 100%, rgba(45,120,100,0.4), transparent 55%),
    linear-gradient(160deg, var(--bg2), var(--bg1) 65%);
  color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background .3s;
}
.glass{background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px;box-shadow:0 8px 32px var(--card-shadow);}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.title{font-size:1.3rem;font-weight:700;
  background:linear-gradient(90deg,var(--accent),#8fd6c4,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{font-size:.78rem;color:var(--text-dim);margin-top:2px;}
.theme-toggle{display:flex;gap:6px;}
.tt-btn{padding:7px 10px;border-radius:12px;font-size:.75rem;cursor:pointer;color:var(--text-dim);
  background:rgba(255,255,255,0.1);border:1px solid var(--glass-border);}
.tt-btn.active{background:var(--accent);color:#1a2e20;font-weight:600;}

.tabs-row{display:flex;gap:8px;margin-bottom:16px;}
.tab-chip{flex:1;text-align:center;padding:10px;font-size:.85rem;cursor:pointer;color:var(--text-dim);
  background:rgba(255,255,255,0.1);border:1px solid var(--glass-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px;}
.tab-chip.active{background:linear-gradient(90deg,var(--accent),#d9b968);color:#1a2e20;font-weight:600;border-color:transparent;}

.panel{padding:20px;margin-bottom:16px;}
.panel h3{font-size:1rem;margin-bottom:14px;}
.field{margin-bottom:14px;}
.field label{font-size:.75rem;color:var(--text-dim);display:block;margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:14px;border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.1);color:var(--text);font-family:inherit;font-size:.87rem;outline:none;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
:root[data-theme="light"] .field input,:root[data-theme="light"] .field select,:root[data-theme="light"] .field textarea{background:rgba(255,255,255,0.45);}
.field select option{color:#1a2e20;}
.field textarea{min-height:110px;resize:vertical;font-family:inherit;}

.btn-primary{width:100%;padding:13px;border:none;border-radius:16px;font-family:inherit;font-weight:600;
  font-size:.9rem;background:linear-gradient(90deg,var(--accent),#d9b968);color:#1a2e20;cursor:pointer;}
.note{font-size:.72rem;color:var(--text-dim);margin-top:10px;line-height:1.5;text-align:center;}

.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:13px;margin-bottom:10px;font-size:.85rem;
  background:rgba(255,255,255,0.08);border:1px solid var(--glass-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px;}
.row .txt b{display:block;font-size:.88rem;margin-bottom:3px;}
.row .txt span{font-size:.75rem;color:var(--text-dim);}
.pill{font-size:.68rem;padding:5px 11px;border-radius:20px;white-space:nowrap;border:1px solid var(--glass-border);}
.pill.pending{background:rgba(224,138,138,0.22);color:var(--danger);}
.pill.paid{background:rgba(143,214,176,0.22);color:var(--good);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="title">অভিযোগ কেন্দ্র</div>
      <div class="sub">হামিদুল উলুম মাদ্রাসা</div>
    </div>
    <div class="theme-toggle">
      <div class="tt-btn active" id="lightBtn" onclick="setTheme('light',this)">☀️</div>
      <div class="tt-btn" id="darkBtn" onclick="setTheme('dark',this)">🌙</div>
    </div>
  </div>

  <div class="tabs-row">
    <div class="tab-chip active" onclick="showView('new',this)">নতুন অভিযোগ</div>
    <div class="tab-chip" onclick="showView('mine',this)">আমার অভিযোগসমূহ</div>
  </div>

  <div id="newView">
    <div class="panel glass">
      <h3>অভিযোগ জমা দিন</h3>
      <div class="field"><label>বিষয়</label>
        <select id="cmpSubject"><option>খাবার সংক্রান্ত</option><option>শিক্ষক/পড়াশোনা সংক্রান্ত</option><option>থাকার ব্যবস্থা</option><option>বেতন/হিসাব সংক্রান্ত</option><option>অন্যান্য</option></select>
      </div>
      <div class="field"><label>বিস্তারিত লিখুন</label><textarea id="cmpDetails" placeholder="আপনার অভিযোগটি বিস্তারিত লিখুন..."></textarea></div>
      <button class="btn-primary" onclick="submitComplaint()">জমা দিন</button>
      <div class="note">আপনার অভিযোগ সরাসরি এডমিনের কাছে যাবে, পরিচয় গোপন রাখতে চাইলে "বেনামে জমা দিন" অপশনও ব্যবহার করা যাবে (ঐচ্ছিক)।</div>
    </div>
  </div>

  <div id="mineView" style="display:none;">
    <div id="mineList" class="note">লোড হচ্ছে...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb = window.supabase.createClient(
  'https://fraqjybeoozsqqbbmqem.supabase.co',
  'sb_publishable_GjIDgcF6NT3p83PLRTLGww_5DDGRiO_'
);
let currentUserId = null;
(async ()=>{
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ alert('অভিযোগ জমা দিতে হলে আগে লগইন করুন'); location.href = 'index.html'; return; }
  currentUserId = session.user.id;
})();

function setTheme(mode,el){
  document.documentElement.setAttribute('data-theme',mode);
  document.querySelectorAll('.theme-toggle .tt-btn').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}
async function showView(v,el){
  document.querySelectorAll('.tab-chip').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('newView').style.display = v==='new' ? 'block':'none';
  document.getElementById('mineView').style.display = v==='mine' ? 'block':'none';
  if(v==='mine') loadMine();
}
async function loadMine(){
  if(!currentUserId) return;
  const {data, error} = await sb.from('complaints').select('*').eq('student_id', currentUserId).order('created_at',{ascending:false});
  const el = document.getElementById('mineList');
  if(error){ el.innerHTML = 'লোড করতে সমস্যা হয়েছে'; return; }
  if(!data || data.length===0){ el.innerHTML = 'আপনি এখনো কোনো অভিযোগ জমা দেননি।'; return; }
  el.innerHTML = data.map(c=>
    `<div class="row"><div class="txt"><b>${c.subject||''}</b><span>${new Date(c.created_at).toLocaleDateString('bn-BD')}</span></div>
      <span class="pill ${c.status==='resolved'?'paid':'pending'}">${c.status==='resolved'?'সমাধান হয়েছে':'পর্যালোচনাধীন'}</span></div>`
  ).join('');
}
async function submitComplaint(){
  if(!currentUserId){ alert('লগইন যাচাই হচ্ছে, একটু পর আবার চেষ্টা করুন'); return; }
  const subject = document.getElementById('cmpSubject').value;
  const details = document.getElementById('cmpDetails').value.trim();
  if(!details){ alert('বিস্তারিত লিখুন'); return; }
  const {error} = await sb.from('complaints').insert({student_id: currentUserId, subject, details, status:'pending'});
  if(error){ alert('জমা দিতে সমস্যা হয়েছে: ' + error.message); return; }
  alert('অভিযোগ জমা হয়েছে — এডমিন প্যানেলে "অভিযোগ কেন্দ্র" ট্যাবে এটি পর্যালোচনাধীন হিসেবে দেখা যাবে।');
  document.getElementById('cmpDetails').value = '';
}
</script>
</body>
</html>
